[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peptide-agent"
version = "0.1.0"
description = "Auditable peptide design with constrained Qwen planning and scientific tools"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
peptide-agent = "peptide_agent.cli:main"

[tool.hatch.build.targets.wheel]
# Explicit public file scope; local development resources are never packaged.
only-include = [
  "src/peptide_agent/__init__.py",
  "src/peptide_agent/analysis.py",
  "src/peptide_agent/benchmark.py",
  "src/peptide_agent/boltz_runner.py",
  "src/peptide_agent/calibration.py",
  "src/peptide_agent/capabilities.py",
  "src/peptide_agent/chemistry.py",
  "src/peptide_agent/cli.py",
  "src/peptide_agent/contracts.py",
  "src/peptide_agent/decoding.py",
  "src/peptide_agent/downloads.py",
  "src/peptide_agent/gateway.py",
  "src/peptide_agent/llm.py",
  "src/peptide_agent/mcp_server.py",
  "src/peptide_agent/models.py",
  "src/peptide_agent/policy.json",
  "src/peptide_agent/skills/analyze-peptide/SKILL.md",
  "src/peptide_agent/skills/design-peptide/SKILL.md",
  "src/peptide_agent/store.py",
  "src/peptide_agent/structural.py",
  "src/peptide_agent/toxicity.py",
  "src/peptide_agent/web.py",
  "src/peptide_agent/web/app.js",
  "src/peptide_agent/web/index.html",
  "src/peptide_agent/web/styles.css",
  "src/peptide_agent/web/shared.css",
  "src/peptide_agent/web/shared.js",
  "src/peptide_agent/web_worker.py",
  "src/peptide_agent/worker.py",
  "src/peptide_agent/workflow.py",
]
packages = ["src/peptide_agent"]

[tool.hatch.build.targets.sdist]
# Keep this list aligned with the reviewed public source files.
only-include = [
  ".gitignore",
  "Makefile",
  "README.md",
  "README_zh.md",
  "configs/mcp.json",
  "docs/architecture.md",
  "docs/architecture_zh.md",
  "docs/model-selection.md",
  "docs/model-selection_zh.md",
  "environment.yml",
  "examples/cyclic.yaml",
  "examples/design.yaml",
  "examples/library.yaml",
  "install.sh",
  "pyproject.toml",
  "requirements.txt",
  "src/peptide_agent/__init__.py",
  "src/peptide_agent/analysis.py",
  "src/peptide_agent/benchmark.py",
  "src/peptide_agent/boltz_runner.py",
  "src/peptide_agent/calibration.py",
  "src/peptide_agent/capabilities.py",
  "src/peptide_agent/chemistry.py",
  "src/peptide_agent/cli.py",
  "src/peptide_agent/contracts.py",
  "src/peptide_agent/decoding.py",
  "src/peptide_agent/downloads.py",
  "src/peptide_agent/gateway.py",
  "src/peptide_agent/llm.py",
  "src/peptide_agent/mcp_server.py",
  "src/peptide_agent/models.py",
  "src/peptide_agent/policy.json",
  "src/peptide_agent/skills/analyze-peptide/SKILL.md",
  "src/peptide_agent/skills/design-peptide/SKILL.md",
  "src/peptide_agent/store.py",
  "src/peptide_agent/structural.py",
  "src/peptide_agent/toxicity.py",
  "src/peptide_agent/web.py",
  "src/peptide_agent/web/app.js",
  "src/peptide_agent/web/index.html",
  "src/peptide_agent/web/styles.css",
  "src/peptide_agent/web/shared.css",
  "src/peptide_agent/web/shared.js",
  "src/peptide_agent/web_worker.py",
  "src/peptide_agent/worker.py",
  "src/peptide_agent/workflow.py",
]
