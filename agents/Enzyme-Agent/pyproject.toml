[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enzyme-agent"
version = "0.1.0"
description = "Auditable therapeutic enzyme design, independent evaluation and feedback"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.11,<3", "numpy>=2,<3", "scipy>=1.15,<2", "biopython>=1.85,<2", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3", "scikit-learn>=1.6,<2"]

[project.scripts]
enzyme-agent = "enzyme_agent.cli:main"

[tool.hatch.build.targets.wheel]
# Explicit public file scope; local development resources are never packaged.
only-include = [
  "src/enzyme_agent/__init__.py",
  "src/enzyme_agent/active_learning.py",
  "src/enzyme_agent/benchmark.py",
  "src/enzyme_agent/cli.py",
  "src/enzyme_agent/config.py",
  "src/enzyme_agent/contracts.py",
  "src/enzyme_agent/decoding.py",
  "src/enzyme_agent/evaluation.py",
  "src/enzyme_agent/evolution.py",
  "src/enzyme_agent/exports.py",
  "src/enzyme_agent/extended_models.py",
  "src/enzyme_agent/feedback.py",
  "src/enzyme_agent/folding.py",
  "src/enzyme_agent/gateway.py",
  "src/enzyme_agent/generation.py",
  "src/enzyme_agent/llm.py",
  "src/enzyme_agent/mcp_server.py",
  "src/enzyme_agent/models.py",
  "src/enzyme_agent/mpnn_runner.py",
  "src/enzyme_agent/retrieval.py",
  "src/enzyme_agent/rfdiffusion.py",
  "src/enzyme_agent/science_worker.py",
  "src/enzyme_agent/stability.py",
  "src/enzyme_agent/store.py",
  "src/enzyme_agent/structure.py",
  "src/enzyme_agent/templates.py",
  "src/enzyme_agent/tool_evaluation.py",
  "src/enzyme_agent/web.py",
  "src/enzyme_agent/web/app.js",
  "src/enzyme_agent/web/index.html",
  "src/enzyme_agent/web/styles.css",
  "src/enzyme_agent/web/shared.css",
  "src/enzyme_agent/web/shared.js",
  "src/enzyme_agent/web_worker.py",
  "src/enzyme_agent/workflow.py",
]
packages = ["src/enzyme_agent"]

[tool.hatch.build.targets.sdist]
# Keep this list aligned with the reviewed public source files.
only-include = [
  ".gitignore",
  "README.md",
  "README_zh.md",
  "docs/architecture.md",
  "docs/architecture_zh.md",
  "docs/model-sources.md",
  "docs/model-sources_zh.md",
  "install.sh",
  "pyproject.toml",
  "requirements.txt",
  "run.sh",
  "scripts/bootstrap.sh",
  "scripts/bootstrap_extended.sh",
  "scripts/prepare_dnase.py",
  "src/enzyme_agent/__init__.py",
  "src/enzyme_agent/active_learning.py",
  "src/enzyme_agent/benchmark.py",
  "src/enzyme_agent/cli.py",
  "src/enzyme_agent/config.py",
  "src/enzyme_agent/contracts.py",
  "src/enzyme_agent/decoding.py",
  "src/enzyme_agent/evaluation.py",
  "src/enzyme_agent/evolution.py",
  "src/enzyme_agent/exports.py",
  "src/enzyme_agent/extended_models.py",
  "src/enzyme_agent/feedback.py",
  "src/enzyme_agent/folding.py",
  "src/enzyme_agent/gateway.py",
  "src/enzyme_agent/generation.py",
  "src/enzyme_agent/llm.py",
  "src/enzyme_agent/mcp_server.py",
  "src/enzyme_agent/models.py",
  "src/enzyme_agent/mpnn_runner.py",
  "src/enzyme_agent/retrieval.py",
  "src/enzyme_agent/rfdiffusion.py",
  "src/enzyme_agent/science_worker.py",
  "src/enzyme_agent/stability.py",
  "src/enzyme_agent/store.py",
  "src/enzyme_agent/structure.py",
  "src/enzyme_agent/templates.py",
  "src/enzyme_agent/tool_evaluation.py",
  "src/enzyme_agent/web.py",
  "src/enzyme_agent/web/app.js",
  "src/enzyme_agent/web/index.html",
  "src/enzyme_agent/web/styles.css",
  "src/enzyme_agent/web/shared.css",
  "src/enzyme_agent/web/shared.js",
  "src/enzyme_agent/web_worker.py",
  "src/enzyme_agent/workflow.py",
]
