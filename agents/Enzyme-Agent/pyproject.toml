[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enzyme-agent"
version = "0.1.0"
description = "Auditable therapeutic enzyme design, independent evaluation and feedback"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.11,<3", "numpy>=2,<3", "scipy>=1.15,<2", "biopython>=1.85,<2", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3", "scikit-learn>=1.6,<2"]

[project.scripts]
enzyme-agent = "enzyme_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enzyme_agent"]
