# Main runtime dependencies. Install with: ./install.sh core
# Optional model checkouts and weights are installed separately.
name: drug-agent
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pydantic>=2.11,<3
  - pydantic-settings>=2.6,<3
  - python-dotenv>=1.0
  - typer>=0.15,<1
  - rich>=13.9,<15
  - pyyaml>=6.0,<7
  - jinja2>=3.1,<4
  - structlog>=24.4,<26
  - sqlalchemy>=2.0,<3
  - httpx>=0.27,<1
  - fastapi>=0.115,<1
  - uvicorn>=0.32,<1
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scipy>=1.13,<2
  - scikit-learn>=1.5,<2
  - pyarrow>=17,<22
  - rdkit>=2024.3
  # Choose a build compatible with the target machine's accelerator.
  - pytorch>=2.6
  - anndata>=0.10
  - h5py>=3.11
  - pip:
      - posebusters>=0.6.5
      - meeko>=0.8
      - molvs>=0.1.1
      - spyrmsd>=0.9
      - prolif>=2.2
      - MDAnalysis>=2.10
      - biopython>=1.88
      - useful-rdkit-utils>=2.0
      # Keep the existing adapter-compatible Chemprop version.
      - chemprop==2.2.4
      - admet-ai>=2.0.1
