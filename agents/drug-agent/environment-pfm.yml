# Optional PFM dependencies, applied after the main environment.
# ./install.sh pfm also builds torch_scatter and torch_cluster against the
# installed PyTorch using --no-build-isolation. A compiler may be required.
# Install the upstream checkout separately with ./install.sh pfm-source.
name: drug-agent
channels:
  - conda-forge
  - nodefaults
dependencies:
  - pip:
      - torch_geometric>=2.5
      - easydict>=1.13
      - lmdb>=2.3
      - openbabel-wheel>=3.1
      - tqdm>=4.70
